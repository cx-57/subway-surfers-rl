name: Evaluate reviewed Subway Surfers player session

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/player-session-eval.yml"
      - "agent/player.py"
      - "agent/player_vision.py"
      - "config/player_calibration_session_1795724241854738000.json"
      - "data/reviews/session_1795724241854738000_player.json"
      - "scripts/evaluate_player_session.py"
      - "tests/test_player_motion.py"
      - "tests/test_player_review.py"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<2.3" "opencv-python-headless>=4.10,<4.14"
      - name: Run focused unit and calibration contract tests
        run: |
          python -m unittest -v \
            tests.test_player_motion \
            tests.test_player_review \
            tests.test_player \
            tests.test_player_vision \
            tests.test_geometry \
            tests.test_state \
            tests.test_hazard
      - name: Evaluate original gameplay frames and holdout labels
        run: |
          python scripts/evaluate_player_session.py \
            data/raw/session_1795724241854738000 \
            --calibration config/player_calibration_session_1795724241854738000.json \
            --labels data/reviews/session_1795724241854738000_player.json \
            --output models/evaluation/player_session_1795724241854738000
      - name: Upload reviewable predictions and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-session-1795724241854738000
          path: models/evaluation/player_session_1795724241854738000/
          if-no-files-found: warn
          retention-days: 14
